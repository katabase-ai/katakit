name: Test & Lint

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report every check even when another fails; tests do not wait for typechecking.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            script: format:check
          - name: Lint
            script: lint
          - name: Workspace licenses
            script: licenses:check
          - name: Template manifests
            script: templates:check
          - name: Typecheck
            script: tsc
          - name: Unit tests
            script: test:ci
          - name: Build
            script: build
          - name: Documentation
            script: -F @katakit/docs check
          - name: Documentation export
            script: -F @katakit/docs-export test:ci && pnpm docs:export
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: pnpm ${{ matrix.script }}
  template-copy:
    name: Standalone template copy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install and build a copied template
        run: pnpm templates:copy-check && pnpm examples:check
