name: Test & Lint

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report every check even when another fails; tests do not wait for typechecking.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            script: format:check
          - name: Lint
            script: lint
          - name: Workspace licenses
            script: licenses:check
          - name: Template manifests
            script: templates:check
          - name: Release tooling
            script: release:check
          - name: Typecheck
            script: tsc
          - name: Unit tests
            script: test:ci
          - name: Build and package lint
            script: build && pnpm publint
          - name: Documentation
            script: -F @katakit/docs check
          - name: Documentation export
            script: -F @katakit/docs-export test:ci && pnpm docs:export
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: pnpm ${{ matrix.script }}
  copy-destinations:
    name: Example copy destinations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test scripts/copy-example.test.mjs
  standalone-copy:
    name: Standalone ${{ matrix.kind }} copies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: demos
            script: demos:copy-check
          - kind: gallery
            script: gallery:copy-check
          - kind: starters
            script: templates:copy-check
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install, build, and test independent copies
        run: pnpm ${{ matrix.script }}
  release-plan:
    name: Release versions and notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate version bumps and changelog sections
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/release.mjs plan "$BASE_SHA" "$HEAD_SHA"
