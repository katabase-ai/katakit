name: Deploy Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    name: ${{ matrix.site }} preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: Docs
            package: '@katakit/docs'
            config: wrangler.docs.jsonc
          - site: Gallery
            package: '@katakit/gallery'
            config: gallery/dist/server/wrangler.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test preview reporting
        run: node --test .github/scripts/*.test.mjs
      - name: Check documentation
        if: matrix.site == 'Docs'
        run: pnpm -F @katakit/docs check
      # Registry pins can lag local versions, so dependency filters may omit these libraries.
      - name: Build gallery libraries
        if: matrix.site == 'Gallery'
        run: pnpm build:pkgs
      - name: Require managed inference configuration
        if: matrix.site == 'Gallery' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PROXY_URL: ${{ vars.KATAKIT_DEMO_PROXY_URL }}
        run: test -n "$PROXY_URL"
      # Start emits the gallery Worker configuration.
      - name: Build preview
        # Gallery PR deployments expose developer tools and the header's public Preview toggle.
        # Scope this opt-in to PR builds; ordinary production builds remain public.
        env:
          VITE_GALLERY_DEMO_PROXY_URL: ${{ matrix.site == 'Gallery' && github.event.pull_request.head.repo.full_name == github.repository && vars.KATAKIT_DEMO_PROXY_URL || '' }}
          VITE_GALLERY_PREVIEW_ORIGIN: ${{ matrix.site == 'Gallery' && github.event.pull_request.head.repo.full_name == github.repository && format('https://pr-{0}.katakit-preview.katabase.com', github.event.pull_request.number) || '' }}
          VITE_GALLERY_DEV_MODE: ${{ matrix.site == 'Gallery' && 'true' || 'false' }}
          VITE_GALLERY_SOURCE_REVISION: ${{ matrix.site == 'Gallery' && github.event.pull_request.head.sha || '' }}
        run: pnpm --filter '${{ matrix.package }}' build
      - name: Report fork deployment limitation
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Fork PRs build both viewers but cannot upload previews without repository credentials.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy preview
        id: upload
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SITE: ${{ matrix.site }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ "$PREVIEW_SITE" = "Gallery" ]; then
            pnpm exec wrangler preview --config '${{ matrix.config }}' --name "pr-${PR_NUMBER}" --json | tee "$RUNNER_TEMP/preview-upload.log"
          else
            pnpm exec wrangler versions upload --config '${{ matrix.config }}' --preview-alias "pr-${PR_NUMBER}" | tee "$RUNNER_TEMP/preview-upload.log"
          fi
      - name: Verify managed inference access
        if: matrix.site == 'Gallery' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PROXY_URL: ${{ vars.KATAKIT_DEMO_PROXY_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/verify-preview-inference.mjs "$RUNNER_TEMP/preview-upload.log"
      - name: Report preview result
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        env:
          PREVIEW_SITE: ${{ matrix.site }}
          PREVIEW_STATUS: ${{ job.status }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { readFileSync } = require('node:fs');
            const { updatePreviewComment } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/.github/scripts/preview-comment.mjs').href);
            const log = process.env.PREVIEW_STATUS === 'success'
              ? readFileSync(process.env.RUNNER_TEMP + '/preview-upload.log', 'utf8')
              : '';
            await updatePreviewComment({ github, context, site: process.env.PREVIEW_SITE, status: process.env.PREVIEW_STATUS, log });

  cleanup-gallery:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm the PR is still closed
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            core.setOutput('closed', String(pr.state === 'closed'));
      - name: Delete the gallery Preview
        if: steps.current.outputs.closed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec wrangler preview delete --config gallery/wrangler.jsonc --name "pr-${PR_NUMBER}" --skip-confirmation

defaults:
  run:
    shell: bash
