name: Check default models

# Sends the real Structured Notes request to each provider's default model, so a retired or
# changed default fails here before a developer meets it. Providers without a secret are skipped.
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'katabase-ai/katakit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check provider defaults
        run: pnpm --filter @katakit/demo-notes check:models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
