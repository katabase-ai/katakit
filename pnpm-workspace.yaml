packages:
  - 'pkgs/*'
  - 'demos/*'
  - 'templates/*'
  - 'docs'

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@types/node@24.13.3'

# Examples use ordinary version ranges so their manifests also work outside this workspace.
linkWorkspacePackages: true
