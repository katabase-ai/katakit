<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Katakit starter</title>
  </head>
  <body>
    <main>
      <h1>Katakit Chrome starter</h1>
      <p>Transcribe the active tab and optional microphone locally into Katakit turns.</p>
      <p>First use downloads Moonshine Tiny. The transcript lasts only for this browser session.</p>
      <p id="status" role="status">Recording is off</p>
      <button id="toggle" type="button">Start recording</button>
      <h2>Conversation turns</h2>
      <ol id="turns" aria-label="Conversation turns"></ol>
      <button id="clear" type="button" disabled>Clear transcript</button>
    </main>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
