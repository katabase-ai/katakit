<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local Electron starter that transcribes microphone audio into Katakit turns." />
    <title>Katakit Electron starter</title>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <span class="brand">Katakit</span>
        <span class="platform">Electron starter</span>
      </header>
      <section class="workspace" aria-labelledby="title">
        <h1 id="title">Conversation, in text.</h1>
        <p class="intro">Record your microphone locally. Final speech becomes Katakit turns.</p>
        <button id="record" type="button">Record microphone</button>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="preview" role="status"></p>
        <section aria-labelledby="history-title" class="history">
          <h2 id="history-title">This session</h2>
          <p id="empty">No speech recognized yet.</p>
          <ol id="notes"></ol>
        </section>
      </section>
      <footer>First use downloads Moonshine Tiny. Audio is processed locally; closing the window clears the transcript.</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
